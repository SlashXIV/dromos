<!--
  Icône de Dromos — source de vérité. Les VectorDrawable de app/src/main/res/drawable
  en sont dérivés : modifier ce fichier d'abord.

  Même grammaire que les autres applications de l'auteur (Kalos, Popote, Topo, Brut) :
  une lettre tracée à la main, un trait d'accent fin dessous, les couleurs de la DA.

  Canevas 108×108 (icône adaptative). Seul le cercle central de diamètre 66 est
  garanti visible quel que soit le masque du lanceur.
  - D : tracé plein en evenodd, fût de 8,5, boîte 25,5 × 29 (y 35 → 64), centré sur x = 54.
  - Trait : 31 × 2, arrondi 1, à y = 70. Un TRAIT, pas un bandeau.
  Couleurs de la palette Corail (fond neutre sombre, corail #EE6055).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <clipPath id="squircle">
      <path d="M54,0 C86,0 108,22 108,54 C108,86 86,108 54,108 C22,108 0,86 0,54 C0,22 22,0 54,0 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="108" height="108" fill="#111315"/>
    <path fill="#F4F1EC" fill-rule="evenodd" d="M41.5,35H52.5C61.5,35 67,40.6 67,49.5C67,58.4 61.5,64 52.5,64H41.5Z M50,42H52.2C56.6,42 58.5,44.8 58.5,49.5C58.5,54.2 56.6,57 52.2,57H50Z"/>
    <rect x="38.5" y="70" width="31" height="2" rx="1" fill="#EE6055"/>
  </g>
</svg>
