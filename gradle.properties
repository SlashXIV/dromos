# --- JVM du démon Gradle ---
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# --- Performance de build ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 compile lui-même le Kotlin des modules Android : aucun plugin
# org.jetbrains.kotlin.android n'est appliqué. Seuls les modules JVM purs
# (:core:domain) appliquent org.jetbrains.kotlin.jvm.

kotlin.code.style=official

# AGP 9 exige un JDK 17+. Depuis un terminal :
#   export JAVA_HOME="/c/Program Files/Android/Android Studio/jbr"
